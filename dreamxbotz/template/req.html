    <style>
        /* Stylesheet created by @bharath_boy || kindly retain this credit notice */
        :root {
            --primary-cyan: #06b6d4;
            --primary-purple: #8b5cf6;
            --primary-pink: #ec4899;
            --primary-orange: #f59e0b;
            --dark-bg: #0f172a;
            --dark-secondary: #1e293b;
            --dark-accent: #334155;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 50%, var(--dark-bg) 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* The following styles were written by @bharath_boy || do not remove credit */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .gradient-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(6, 182, 212, 0.15), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.15), transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(236, 72, 153, 0.1), transparent 50%);
            z-index: 2;
            pointer-events: none;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Code credit: @bharath_boy || this line should not be removed */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1rem 2rem;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.75rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            transition: width 0.3s ease;
        }

        .logo:hover::after {
            width: 100%;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-cyan);
            transition: width 0.3s ease;
        }

        .nav a:hover {
            color: var(--primary-cyan);
        }

        .nav a:hover::before {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .mobile-menu-btn:hover {
            transform: rotate(90deg);
        }

        .mobile-nav {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 1rem;
        }

        .mobile-nav.active {
            display: block;
        }

        /* Authored by @bharath_boy || please leave this credit intact */
        .mobile-nav a {
            display: block;
            padding: 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .mobile-nav a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary-cyan);
        }

        .main-container {
            position: relative;
            z-index: 10;
            padding-top: 6rem;
            max-width: 1400px;
            /* Default max-width */
            margin: 0 auto;
            padding-left: 2rem;
            padding-right: 2rem;
            transition: max-width 0.5s ease-in-out;
        }

        .video-section {
            margin-bottom: 4rem;
        }

        .video-container {
            position: relative;
            margin-bottom: 2rem;
            border-radius: 1.5rem;
            overflow: hidden;
            background: var(--dark-secondary);
            transition: all 0.3s ease;
        }

        .video-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            border-radius: 1.5rem;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-container:hover::before {
            opacity: 0.6;
        }

        .video-container video {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        /* This CSS was crafted by @bharath_boy || credit removal is not permitted */
        .info-panel {
            border-radius: 1.5rem;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
        }

        .info-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
            border-radius: 1.5rem;
        }

        .info-panel:hover::before {
            left: 100%;
        }

        .file-info h4 {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .file-info {
            /* Add this to allow the flex item to shrink below its content size */
            min-width: 0;
        }

        .file-name {
            /* Add this to allow the long file name to wrap */
            word-break: break-word;
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.5rem;
            background: var(--primary-cyan);
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .panel-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--dark-accent);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--glass-border);
        }

        .size-control i {
            color: var(--text-secondary);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 4px;
            background: var(--dark-bg);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary-cyan);
            border-radius: 50%;
            border: 2px solid var(--dark-bg);
            transition: background 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--primary-purple);
        }

        /* Code by @bharath_boy || we request you keep the credit */
        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            position: relative;
        }

        .action-btn {
            position: relative;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            color: white;
        }

        .action-btn img {
            width: 24px;
            height: 24px;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .action-btn:hover::before {
            left: 100%;
        }

        .action-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .action-btn.secondary {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
        }

        .action-btn.tertiary {
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-orange));
        }

        .action-btn.quaternary {
            background: var(--dark-accent);
        }

        .more-players-dropdown {
            position: absolute;
            bottom: 110%;
            right: 0;
            width: 280px;
            padding: 1rem;
            border-radius: 1rem;
            z-index: 110;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .more-players-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .player-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 0.75rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .player-btn:hover {
            background: var(--primary-cyan);
            color: white;
            transform: scale(1.05);
        }

        /* @bharath_boy is the author of this style block || please maintain attribution */
        .player-btn img {
            width: 24px;
            height: 24px;
        }

        .player-btn span {
            font-weight: 500;
        }

        .explore-section {
            margin: 6rem 0;
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .info-card {
            border-radius: 1.5rem;
            padding: 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            transform-style: preserve-3d;
        }

        .info-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            border-radius: 1.5rem;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* This section was styled by @bharath_boy || don't erase the credit */
        .info-card:hover::before {
            opacity: 0.6;
        }

        .info-card:hover {
            transform: perspective(1000px) rotateX(5deg) rotateY(5deg) translateZ(20px);
        }

        .card-icon {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .card-icon img {
            width: 2.5rem;
            height: 2.5rem;
        }

        .info-card h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .info-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .card-links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card-btn {
            display: block;
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card-btn:nth-child(1) {
            background: linear-gradient(135deg, var(--primary-cyan), #0891b2);
            color: white;
        }

        .card-btn:nth-child(2) {
            background: linear-gradient(135deg, var(--primary-purple), #7c3aed);
            color: white;
        }

        .card-btn:nth-child(3) {
            background: linear-gradient(135deg, var(--primary-pink), #db2777);
            color: white;
        }
        .card-btn:nth-child(4) {
            background: linear-gradient(135deg, var(--primary-orange), #d97706);
            color: white;
        }

        .card-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
        }

        .footer a {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer a:hover {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
            -webkit-background-clip: text;
            background-clip: text;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, var(--primary-cyan), transparent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
            transition: all 0.1s ease;
        }

        @media (max-width: 768px) {
            .nav {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .main-container {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            .info-panel {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }

            .panel-actions {
                width: 100%;
                justify-content: center;
            }

            .action-buttons {
                justify-content: center;
            }

            .section-title {
                font-size: 2rem;
            }

            .file-name {
                font-size: 1.5rem;
            }

            .cards-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .info-card {
                padding: 2rem;
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thum
